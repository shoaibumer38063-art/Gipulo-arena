[package]
name = "gip-document"
description = "Gipulo document model (.gip tree). Contract: docs/architecture/document-tree.md; format: ADR-003"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ADR-003 (PROPOSED): the ONE registered layer-1 exception (dependencies.md §2/§3).
# float_roundtrip: serde_json parses f64 correctly rounded only with this feature (ADR-003 #3).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# ADR-009: documentHash (SHA-256) and NFC checks. Pure Rust, no I/O.
sha2 = "0.11"
unicode-normalization = "0.1"
